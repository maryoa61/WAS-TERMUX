<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#161e2b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00c8ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#00ff88" stroke-width="6" stroke-opacity="0.35" />
  
  <!-- Terminal Header Dots -->
  <circle cx="80" cy="84" r="14" fill="#ff5f56" />
  <circle cx="120" cy="84" r="14" fill="#ffbd2e" />
  <circle cx="160" cy="84" r="14" fill="#27c93f" />

  <!-- Alpine / Termux Terminal Prompt: > _ and Linux Alpine badge -->
  <path d="M 110 180 L 220 270 L 110 360" fill="none" stroke="url(#accent)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <rect x="256" y="328" width="130" height="32" rx="10" fill="url(#accent)" filter="url(#glow)" />

  <!-- WebAssembly Badge in Top-Right -->
  <g transform="translate(350, 68)">
    <rect width="84" height="36" rx="8" fill="#654ff0" />
    <text x="42" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle">WASM</text>
  </g>

  <!-- Small Termux alpine mountain icon in bottom-right -->
  <path d="M 330 420 L 375 360 L 400 390 L 440 330 L 475 420 Z" fill="#213047" opacity="0.8" />
  <path d="M 360 420 L 390 380 L 420 420 Z" fill="#00ff88" opacity="0.4" />
</svg>
